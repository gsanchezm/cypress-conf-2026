name: CI triage

# Fires after the deterministic suite fails on main (workflow_run only
# triggers from the default branch) and classifies the failure from logs.
# Flake or cold start with confidence >= 0.7 -> rerun the failed jobs;
# anything else -> PR comment or issue with the evidence. No model secret is required.
# Never records to Cypress Cloud and never touches the cy.prompt suite.

on:
  workflow_run:
    workflows: ["Deterministic suite"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Run id of a failed "Deterministic suite" run to triage
        required: true
        type: string

permissions:
  contents: read
  actions: write
  pull-requests: write
  issues: write

concurrency:
  group: ci-triage-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  triage:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download failure screenshots from the failed run
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
          pattern: screenshots-*
          path: ci-artifacts/screenshots

      - name: Collect failed job logs
        id: failure_details
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            fs.mkdirSync('ci-artifacts/logs', { recursive: true });
            const runId = Number(process.env.RUN_ID);
            const { owner, repo } = context.repo;
            const run = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { owner, repo, run_id: runId, per_page: 100 });
            const failed = jobs.filter((job) => job.conclusion === 'failure');
            await Promise.all(
              failed.map(async (job) => {
                const logs = await github.rest.actions.downloadJobLogsForWorkflowRun({ owner, repo, job_id: job.id });
                const safeName = job.name.replace(/[^a-zA-Z0-9._-]/g, '_');
                fs.writeFileSync(`ci-artifacts/logs/${safeName}.log`, String(logs.data));
              }),
            );
            core.setOutput('run_url', run.data.html_url);
            core.setOutput('head_branch', run.data.head_branch);
            core.setOutput('failed_jobs', failed.map((job) => job.name).join(', ') || '(none)');
            core.setOutput('pr_number', run.data.pull_requests?.[0]?.number ?? '');

      - name: Deterministic verdict
        run: |
          shopt -s nullglob
          logs=(ci-artifacts/logs/*.log)
          if [ ${#logs[@]} -eq 0 ]; then printf '' | pnpm triage:verdict > ci-artifacts/deterministic-verdict.json; else pnpm triage:verdict "${logs[@]}" > ci-artifacts/deterministic-verdict.json; fi
          cat ci-artifacts/deterministic-verdict.json

      - name: Select verdict
        id: verdict
        run: |
          cp ci-artifacts/deterministic-verdict.json ci-artifacts/verdict.json
          echo "json=$(jq -c . ci-artifacts/verdict.json)" >> "$GITHUB_OUTPUT"

      # workflow_run "completed" fires again for every rerun attempt, so the rerun is capped at run_attempt < 3.
      - name: Rerun failed jobs (flake or cold start, confidence >= 0.7, at most two reruns)
        id: rerun
        if: |
          steps.verdict.outputs.json != '' &&
          (github.event_name == 'workflow_dispatch' || github.event.workflow_run.run_attempt < 3) &&
          (fromJSON(steps.verdict.outputs.json).category == 'flake' ||
           fromJSON(steps.verdict.outputs.json).category == 'cold_start') &&
          fromJSON(steps.verdict.outputs.json).confidence >= 0.7
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ steps.verdict.outputs.json }}
        run: |
          echo "Rerunning failed jobs of run $RUN_ID: $(echo "$VERDICT" | jq -r '.summary')"
          gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"

      # Exact complement of the rerun gate: an exhausted-attempts flake/cold_start verdict lands here.
      - name: Report the verdict on the PR or as an issue
        id: report
        if: |
          steps.verdict.outputs.json != '' &&
          fromJSON(steps.verdict.outputs.json).category != null &&
          !((github.event_name == 'workflow_dispatch' || github.event.workflow_run.run_attempt < 3) &&
            (fromJSON(steps.verdict.outputs.json).category == 'flake' ||
             fromJSON(steps.verdict.outputs.json).category == 'cold_start') &&
            fromJSON(steps.verdict.outputs.json).confidence >= 0.7)
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ steps.verdict.outputs.json }}
          PR_NUMBER: ${{ steps.failure_details.outputs.pr_number }}
          RUN_URL: ${{ steps.failure_details.outputs.run_url }}
          HEAD_BRANCH: ${{ steps.failure_details.outputs.head_branch }}
        run: |
          category=$(echo "$VERDICT" | jq -r '.category')
          confidence=$(echo "$VERDICT" | jq -r '.confidence')
          summary=$(echo "$VERDICT" | jq -r '.summary')
          evidence=$(echo "$VERDICT" | jq -r '.evidence[] | "- " + .')
          body=$(printf '## CI triage: `%s` (confidence %s)\n\n%s\n\n**Evidence**\n%s\n\n[Failed run](%s)\n' "$category" "$confidence" "$summary" "$evidence" "$RUN_URL")
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "CI triage: $category on $HEAD_BRANCH (run $RUN_ID)" --body "$body"
          fi

      - name: Job summary
        if: always()
        env:
          VERDICT: ${{ steps.verdict.outputs.json }}
        # The fallback is single-quoted on purpose: a bare `}` inside
        # ${VAR:-...} ends the expansion early and leaves a stray brace.
        run: |
          verdict=${VERDICT:-'{"error":"no verdict produced"}'}
          {
            echo "## CI triage"
            echo
            echo '```json'
            jq . <<< "$verdict" || printf '%s\n' "$verdict"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
