# BUDGET (verified 2026-09-02, docs.cypress.io/cloud/faq#cyprompt + cypress.io/pricing):
# every cy.prompt() command that runs is one billed execution. This suite
# makes 2 calls x 5 markets = 10 executions per dispatch, plus 5 recorded
# test results. The free Starter plan holds 100 executions and 500 test
# results per month -> 10 dispatches a month, rehearsals included, and a
# Cypress retry re-runs the scenario's calls. Only the repo owner triggers
# this workflow. A local recorded run passed all five markets on 2026-10-19.
name: cy.prompt suite

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cypress-cyprompt:
    name: checkout (cy.prompt)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run typecheck

      - name: Run Checkout via cy.prompt
        run: pnpm exec cypress run --spec "cypress/e2e/checkout/checkout.feature" --expose UI_STRATEGY=cyPrompt --browser chrome --record
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}

      - name: Upload mochawesome report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-cyprompt-checkout
          path: cypress/reports/mochawesome
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload screenshots (failures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-cyprompt-checkout
          path: cypress/screenshots
          retention-days: 7
          if-no-files-found: ignore
