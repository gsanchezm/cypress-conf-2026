<text x="97" y="736" fill="#BACABA" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">after:spec collects results; after:run reads @C tags, maps passed/failed cases, calls add_run → add_results_for_cases → close_run.</text>
<text x="97" y="767" fill="#BACABA" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">Requires TESTRAIL_URL; pending/skipped tests are not submitted. Publishing errors are logged without changing the Cypress exit code.</text>
